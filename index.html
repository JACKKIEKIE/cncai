<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef4ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="灵语智造" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>灵语智造 LinguaCNC | iPhone CNC AI 工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --app-bg: #f5f5f7;
        --app-fg: #0f172a;
        --app-muted: #64748b;
        --app-card: rgba(255, 255, 255, 0.92);
        --app-card-border: rgba(255, 255, 255, 0.86);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: var(--app-bg);
        background-image:
          radial-gradient(at 0% 0%, rgba(10, 132, 255, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(255, 55, 95, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(48, 209, 88, 0.15) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(255, 159, 10, 0.15) 0px, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
        color: var(--app-fg);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'SF Pro Display',
          'SF Pro Text',
          'PingFang SC',
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior-y: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        transition:
          transform 180ms cubic-bezier(0.22, 1, 0.36, 1),
          background-color 180ms cubic-bezier(0.22, 1, 0.36, 1),
          color 180ms cubic-bezier(0.22, 1, 0.36, 1),
          border-color 180ms cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 180ms cubic-bezier(0.22, 1, 0.36, 1);
        touch-action: manipulation;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(15, 23, 42, 0.12);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(15, 23, 42, 0.22);
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .glass-panel {
        background: var(--app-card);
        backdrop-filter: blur(48px) saturate(170%);
        -webkit-backdrop-filter: blur(48px) saturate(170%);
        border: 1px solid var(--app-card-border);
        box-shadow: 0 16px 38px 0 rgba(31, 38, 135, 0.08);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .animate-fade-in {
        animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .animate-slide-up {
        animation: slideUp 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      const isNativeShell =
        /\bCapacitor\b/i.test(navigator.userAgent) ||
        Boolean(window.Capacitor && (window.Capacitor.isNativePlatform?.() ?? true));

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (isNativeShell) {
            navigator.serviceWorker
              .getRegistrations()
              .then((registrations) => Promise.allSettled(registrations.map((registration) => registration.unregister())))
              .catch(() => {});
            return;
          }

          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
